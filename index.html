<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1C1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bookshelf">
<title>Bookshelf</title>
<style>
:root{
  --bg:#1C1410;--bg2:#221810;--bg3:#2A1E14;--card:#261A10;
  --border:rgba(255,210,120,0.10);--border2:rgba(255,210,120,0.22);
  --gold:#D4943A;--gold-lt:#E8B568;--cream:#F0E6D0;--cream2:#C8B898;--muted:#8A7A64;
  --star-on:#E8B568;--red:#C0503A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--cream);font-family:'Inter',sans-serif;overscroll-behavior:none}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}

#login-screen{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:24px}
#login-screen.active{display:flex}
.login-logo{font-size:52px;font-weight:700;color:var(--cream);font-family:"Playfair Display",serif;letter-spacing:-1px}.login-logo em{color:var(--gold);font-style:italic}
.login-sub{font-size:15px;color:var(--muted);text-align:center;line-height:1.6}
.google-btn{display:flex;align-items:center;gap:12px;padding:14px 28px;background:var(--cream);color:#1C1410;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.google-btn:active{opacity:0.85}
.google-btn img{width:20px;height:20px}

header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:700;color:var(--cream);font-family:"Playfair Display",serif;letter-spacing:-0.3px}.logo em{color:var(--gold);font-style:italic}
.header-right{display:flex;align-items:center;gap:12px}
.book-count{font-size:13px;color:var(--muted)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);overflow:hidden;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--gold)}
.user-avatar img{width:100%;height:100%;object-fit:cover}

nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--bg2);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 8px 10px;background:none;border:none;font-size:10px;letter-spacing:0.04em;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:inherit;text-transform:uppercase;transition:color 0.15s}
nav button.active{color:var(--gold)}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.view{display:none;padding:16px;padding-bottom:80px}
.view.active{display:block}

.stats{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.stat{font-size:12px;color:var(--cream2);background:var(--bg3);border:1px solid var(--border);padding:5px 14px;border-radius:20px}
.stat b{color:var(--gold-lt);font-weight:600}

.shelf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:600px){.shelf-grid{grid-template-columns:repeat(5,1fr);gap:12px}}
@media(min-width:900px){.shelf-grid{grid-template-columns:repeat(7,1fr);gap:14px}}

.shelf-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color 0.15s}
.shelf-card:active{opacity:0.8}
.shelf-card-img{width:100%;aspect-ratio:2/3;background:var(--bg3);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.shelf-card-img img{width:100%;height:100%;object-fit:cover}
.shelf-card-img .no-cover{font-size:28px;opacity:0.3}
.rating-badge{position:absolute;bottom:5px;right:5px;background:rgba(20,14,8,0.88);border:1px solid var(--border2);border-radius:6px;padding:2px 6px;font-size:11px;font-weight:600;color:var(--gold-lt)}
.shelf-card-body{padding:7px 8px 9px}
.shelf-card-title{font-size:11px;font-weight:600;color:var(--cream);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shelf-card-author{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shelf-card-date{font-size:10px;color:var(--gold);margin-top:2px}

/* WISHLIST */
.wish-card{display:flex;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;padding:12px;cursor:pointer}
.wish-card:active{opacity:0.8}
.wish-thumb{width:46px;height:66px;background:var(--bg3);border-radius:6px;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.wish-thumb img{width:100%;height:100%;object-fit:cover}
.wish-thumb .no-img{font-size:20px;opacity:0.3}
.wish-meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.wish-title{font-size:14px;font-weight:600;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wish-author{font-size:12px;color:var(--cream2)}
.wish-year{font-size:11px;color:var(--muted)}
.wish-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;justify-content:center;flex-shrink:0}
.wish-read-btn{padding:6px 10px;background:var(--gold);color:#1C1410;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.wish-del-btn{padding:5px 10px;background:none;border:1px solid var(--border2);color:var(--muted);border-radius:8px;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap}
.wish-buy-btn{display:block;padding:6px 10px;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:8px;font-size:11px;font-weight:600;text-decoration:none;white-space:nowrap;text-align:center}

.search-wrap{display:flex;gap:8px;margin-bottom:14px}
.search-wrap input{flex:1;height:44px;padding:0 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:12px;font-size:15px;color:var(--cream);font-family:inherit;outline:none}
.search-wrap input::placeholder{color:var(--muted)}
.search-wrap input:focus{border-color:var(--gold)}
.search-wrap button{height:44px;padding:0 16px;background:var(--gold);color:#1C1410;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.search-status{font-size:13px;color:var(--muted);margin-bottom:10px}
.result-card{display:flex;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;padding:12px}
.result-thumb{width:50px;height:72px;background:var(--bg3);border-radius:6px;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.result-thumb img{width:100%;height:100%;object-fit:cover}
.result-thumb .no-img{font-size:22px;opacity:0.3}
.result-meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.result-title{font-size:14px;font-weight:600;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result-author{font-size:12px;color:var(--cream2)}
.result-year{font-size:11px;color:var(--muted)}
.result-btns{display:flex;flex-direction:column;gap:6px;align-items:flex-end;justify-content:center;flex-shrink:0}
.add-btn{padding:7px 10px;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.add-btn:disabled{opacity:0.35;cursor:default;border-color:var(--muted);color:var(--muted)}
.wish-add-btn{padding:7px 10px;background:none;border:1px solid var(--border2);color:var(--cream2);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.wish-add-btn:disabled{opacity:0.35;cursor:default}

.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--gold);font-size:15px;cursor:pointer;font-family:inherit;margin-bottom:18px;padding:0}
.back-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.detail-hero{display:flex;gap:16px;margin-bottom:22px}
.detail-cover{width:90px;height:134px;background:var(--bg3);border-radius:10px;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid var(--border)}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail-cover .no-img{font-size:36px;opacity:0.3}
.detail-info{display:flex;flex-direction:column;justify-content:center;gap:5px}
.detail-title{font-size:17px;font-weight:700;color:var(--cream);line-height:1.3}
.detail-author{font-size:13px;color:var(--cream2)}
.detail-year{font-size:12px;color:var(--muted)}

.section-label{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.divider{height:1px;background:var(--border);margin:18px 0}

.star-row{display:flex;gap:4px;margin-bottom:4px}
.star-btn{font-size:36px;background:none;border:none;cursor:pointer;padding:2px;line-height:1;color:#3A2E22;transition:color 0.1s}
.star-btn.on{color:var(--star-on)}
.star-hint{font-size:13px;color:var(--muted);margin-bottom:18px;min-height:18px}

.date-wrap{display:flex;gap:8px;margin-bottom:18px;align-items:center}
.date-wrap input[type="date"]{flex:1;height:42px;padding:0 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;font-size:14px;color:var(--cream);font-family:inherit;outline:none;color-scheme:dark}
.date-wrap input[type="date"]:focus{border-color:var(--gold)}
.date-clear{padding:8px 12px;background:none;border:1px solid var(--border2);color:var(--muted);border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit}

.review-box{width:100%;min-height:100px;padding:12px;background:var(--bg3);border:1px solid var(--border2);border-radius:12px;font-size:15px;color:var(--cream);font-family:inherit;resize:vertical;outline:none;margin-bottom:14px}
.review-box::placeholder{color:var(--muted)}
.review-box:focus{border-color:var(--gold)}

.btn-row{display:flex;gap:10px;justify-content:flex-end}
.btn-save{padding:11px 24px;background:var(--gold);color:#1C1410;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-delete{padding:11px 14px;background:none;border:1px solid var(--border2);color:var(--muted);border-radius:12px;font-size:15px;cursor:pointer;font-family:inherit}
.btn-delete:active{border-color:var(--red);color:var(--red)}

.empty{text-align:center;padding:56px 20px;color:var(--muted);grid-column:1/-1}
.empty-icon{font-size:48px;margin-bottom:14px;opacity:0.4}
.empty p{font-size:14px;line-height:1.7}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--cream);color:#1C1410;padding:10px 22px;border-radius:20px;font-size:14px;font-weight:600;z-index:300;opacity:0;transition:opacity 0.2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

#loading{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted)}
</style>
</head>
<body>

<div id="loading">불러오는 중...</div>

<div id="login-screen">
  <div class="login-logo">Book<em>shelf</em></div>
  <div class="login-sub">읽은 책을 기록하고<br>어디서든 꺼내보세요</div>
  <button class="google-btn" onclick="signIn()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
    Google로 로그인
  </button>
</div>

<div id="app" style="display:none">
  <header>
    <div class="logo" onclick="switchView('shelf')" style="cursor:pointer">Book<em>shelf</em></div>
    <div class="header-right">
      <div class="book-count" id="hdr-count"></div>
      <div class="user-avatar" id="user-avatar" onclick="signOut()" title="로그아웃"></div>
    </div>
  </header>

  <!-- 책장 -->
  <div id="shelf-view" class="view active">
    <div class="stats" id="stats-bar" style="display:none"></div>
    <div class="shelf-grid" id="shelf-grid"></div>
  </div>

  <!-- 읽고 싶은 책 -->
  <div id="wish-view" class="view">
    <div id="wish-list"></div>
  </div>

  <!-- 검색 -->
  <div id="search-view" class="view">
    <div class="search-wrap">
      <input id="search-input" type="search" placeholder="책 제목, 저자로 검색…">
      <button onclick="doSearch()">검색</button>
    </div>
    <div class="search-status" id="search-status" style="display:none"></div>
    <div id="search-results"></div>
  </div>

  <!-- 상세 -->
  <div id="detail-view" class="view">
    <button class="back-btn" onclick="closeDetail()">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      뒤로
    </button>
    <div class="detail-hero">
      <div class="detail-cover" id="det-cover"></div>
      <div class="detail-info">
        <div class="detail-title" id="det-title"></div>
        <div class="detail-author" id="det-author"></div>
        <div class="detail-year" id="det-year"></div>
      </div>
    </div>
    <div class="section-label">내 평점</div>
    <div class="star-row" id="star-row"></div>
    <div class="star-hint" id="star-hint"></div>
    <div class="divider"></div>
    <div class="section-label">읽은 날짜</div>
    <div class="date-wrap">
      <input type="date" id="read-date">
      <button class="date-clear" onclick="clearDate()">지우기</button>
    </div>
    <div class="section-label">감상 메모</div>
    <textarea class="review-box" id="review-box" placeholder="읽은 후 남기고 싶은 말…"></textarea>
    <div class="btn-row">
      <button class="btn-delete" onclick="deleteBook()">삭제</button>
      <button class="btn-save" onclick="saveBook()">저장</button>
    </div>
  </div>

  <nav>
    <button class="active" id="nav-shelf" onclick="switchView('shelf')">
      <svg viewBox="0 0 24 24"><rect x="2" y="4" width="6" height="16" rx="1"/><rect x="9" y="4" width="6" height="16" rx="1"/><rect x="16" y="4" width="6" height="16" rx="1" opacity=".45"/></svg>
      책장
    </button>
    <button id="nav-wish" onclick="switchView('wish')">
      <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      읽을 책
    </button>
    <button id="nav-search" onclick="switchView('search')">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      책 추가
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut as fbSignOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAvF1Y4kGAv8fTLvRtHE2GsjnfJVD3RGs8",
  authDomain: "bookshelf-a65a7.firebaseapp.com",
  projectId: "bookshelf-a65a7",
  storageBucket: "bookshelf-a65a7.firebasestorage.app",
  messagingSenderId: "17358554647",
  appId: "1:17358554647:web:96c0b63b01bc4f15707e52"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const STAR_LABELS = ['','별로예요','그저 그래요','괜찮아요','좋았어요','최고예요'];
let shelf = [], wishlist = [];
let curIdx = null, curRating = 0, prevView = 'shelf';
let currentUser = null, unsubShelf = null, unsubWish = null;

window.signIn = async () => { try { await signInWithPopup(auth, provider); } catch(e) { console.error(e); } };
window.signOut = async () => {
  if(!confirm('로그아웃 할까요?')) return;
  if(unsubShelf) unsubShelf();
  if(unsubWish) unsubWish();
  await fbSignOut(auth);
};

onAuthStateChanged(auth, user => {
  document.getElementById('loading').style.display = 'none';
  if(user) {
    currentUser = user;
    document.getElementById('login-screen').classList.remove('active');
    document.getElementById('app').style.display = 'block';
    const av = document.getElementById('user-avatar');
    if(user.photoURL) av.innerHTML = `<img src="${user.photoURL}" alt="프로필">`;
    else av.textContent = user.displayName?.[0] || 'U';
    loadData();
  } else {
    currentUser = null;
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').classList.add('active');
    shelf = []; wishlist = [];
  }
});

function loadData() {
  if(!currentUser) return;
  if(unsubShelf) unsubShelf();
  if(unsubWish) unsubWish();
  const q1 = query(collection(db, 'users', currentUser.uid, 'books'), orderBy('addedAt','desc'));
  unsubShelf = onSnapshot(q1, snap => { shelf = snap.docs.map(d=>({id:d.id,...d.data()})); renderShelf(); });
  const q2 = query(collection(db, 'users', currentUser.uid, 'wishlist'), orderBy('addedAt','desc'));
  unsubWish = onSnapshot(q2, snap => { wishlist = snap.docs.map(d=>({id:d.id,...d.data()})); renderWish(); });
}

async function persistBook(book) {
  if(!currentUser) return;
  await setDoc(doc(db,'users',currentUser.uid,'books',book.gid), book);
}
async function removeBook(gid) {
  if(!currentUser) return;
  await deleteDoc(doc(db,'users',currentUser.uid,'books',gid));
}
async function persistWish(book) {
  if(!currentUser) return;
  await setDoc(doc(db,'users',currentUser.uid,'wishlist',book.gid), book);
}
async function removeWish(gid) {
  if(!currentUser) return;
  await deleteDoc(doc(db,'users',currentUser.uid,'wishlist',gid));
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

window.switchView = (v) => {
  ['shelf','wish','search','detail'].forEach(x => {
    document.getElementById(x+'-view').classList.toggle('active', x===v);
    const b = document.getElementById('nav-'+x);
    if(b) b.classList.toggle('active', x===v);
  });
  if(v !== 'detail') prevView = v;
};

function renderShelf() {
  const grid = document.getElementById('shelf-grid');
  const statsBar = document.getElementById('stats-bar');
  const hdr = document.getElementById('hdr-count');
  if(!shelf.length) {
    hdr.textContent = '';
    statsBar.style.display = 'none';
    grid.innerHTML = '<div class="empty"><div class="empty-icon">📚</div><p>아직 읽은 책이 없어요.<br>아래에서 책을 추가해보세요.</p></div>';
    return;
  }
  hdr.textContent = `${shelf.length}권`;
  const rated = shelf.filter(b=>b.r>0);
  const avg = rated.length ? (rated.reduce((a,b)=>a+b.r,0)/rated.length).toFixed(1) : '-';
  statsBar.style.display = 'flex';
  statsBar.innerHTML = `<div class="stat">총 <b>${shelf.length}권</b></div><div class="stat">평균 <b>★ ${avg}</b></div>`;
  grid.innerHTML = shelf.map((b,i) => `
    <div class="shelf-card" onclick="openDetail(${i})">
      <div class="shelf-card-img">
        ${b.thumb?`<img src="${b.thumb}" alt="표지" loading="lazy">`:'<div class="no-cover">📖</div>'}
        ${b.r?`<div class="rating-badge">★ ${b.r}</div>`:''}
      </div>
      <div class="shelf-card-body">
        <div class="shelf-card-title">${esc(b.title)}</div>
        <div class="shelf-card-author">${esc(b.author)}</div>
        ${b.readDate?`<div class="shelf-card-date">${b.readDate}</div>`:''}
      </div>
    </div>`).join('');
}

function renderWish() {
  const list = document.getElementById('wish-list');
  if(!wishlist.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">🔖</div><p>읽고 싶은 책을 추가해보세요.<br>검색에서 "찜" 버튼을 눌러보세요.</p></div>';
    return;
  }
  list.innerHTML = wishlist.map((b,i) => `
    <div class="wish-card">
      <div class="wish-thumb">${b.thumb?`<img src="${b.thumb}" alt="표지" loading="lazy">`:'<div class="no-img">📖</div>'}</div>
      <div class="wish-meta">
        <div class="wish-title">${esc(b.title)}</div>
        <div class="wish-author">${esc(b.author)}</div>
        <div class="wish-year">${b.year||''}</div>
      </div>
      <div class="wish-actions">
        ${b.link?`<a class="wish-buy-btn" href="${b.link}" target="_blank" rel="noopener">🛒 구매</a>`:''}
        <button class="wish-read-btn" onclick="moveToShelf(${i})">읽었어요</button>
        <button class="wish-del-btn" onclick="deleteWish(${i})">삭제</button>
      </div>
    </div>`).join('');
}

window.moveToShelf = async (idx) => {
  const b = wishlist[idx];
  const already = shelf.some(s=>s.gid===b.gid);
  if(!already) {
    await persistBook({...b, r:0, note:'', readDate:'', addedAt:Date.now()});
  }
  await removeWish(b.gid);
  toast('책장으로 이동했어요 📚');
};

window.deleteWish = async (idx) => {
  if(!confirm('삭제할까요?')) return;
  await removeWish(wishlist[idx].gid);
};

window.openDetail = (idx) => {
  curIdx = idx;
  const b = shelf[idx];
  curRating = b.r||0;
  const dc = document.getElementById('det-cover');
  dc.innerHTML = b.thumb?`<img src="${b.thumb}" alt="표지">`:'<div class="no-img">📖</div>';
  document.getElementById('det-title').textContent = b.title;
  document.getElementById('det-author').textContent = b.author;
  document.getElementById('det-year').textContent = b.year||'';
  document.getElementById('review-box').value = b.note||'';
  document.getElementById('read-date').value = b.readDate||'';
  renderStars();
  window.switchView('detail');
};

function renderStars() {
  document.getElementById('star-row').innerHTML = [1,2,3,4,5].map(s=>`
    <button class="star-btn${curRating>=s?' on':''}" onclick="setRating(${s})" onmouseover="previewHint(${s})" onmouseout="resetHint()" aria-label="${s}점">★</button>`).join('');
  document.getElementById('star-hint').textContent = curRating?STAR_LABELS[curRating]:'';
}

window.previewHint = n => { document.getElementById('star-hint').textContent = STAR_LABELS[n]; };
window.resetHint = () => { document.getElementById('star-hint').textContent = STAR_LABELS[curRating]||''; };
window.setRating = n => { curRating=n; renderStars(); };
window.clearDate = () => { document.getElementById('read-date').value=''; };

window.saveBook = async () => {
  const b = {...shelf[curIdx]};
  b.r = curRating;
  b.note = document.getElementById('review-box').value.trim();
  b.readDate = document.getElementById('read-date').value;
  await persistBook(b);
  toast('저장했어요 ✓');
  setTimeout(()=>window.switchView('shelf'), 1200);
};

window.deleteBook = async () => {
  if(!confirm('이 책을 삭제할까요?')) return;
  await removeBook(shelf[curIdx].gid);
  window.switchView('shelf');
};

window.closeDetail = () => window.switchView(prevView);

document.getElementById('search-input').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });

const NAVER_PROXY = 'https://bookshelf-proxy.bhkim7180.workers.dev';
const GOOGLE_KEY = 'AIzaSyDsDRQ7zRtUT65sRgwOluJx_e0r4hfMdG4';
const PAGE_SIZE = 10;

let searchQuery = '';
let searchStartIndex = 0; // Google용
let naverStart = 1;       // 네이버용 (1부터 시작)
let useNaver = false;

function isKorean(text) {
  return /[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(text);
}

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if(!q) return;
  searchQuery = q;
  searchStartIndex = 0;
  naverStart = 1;
  useNaver = isKorean(q);
  document.getElementById('search-results').innerHTML = '';
  await fetchResults(true);
}

async function fetchResults(isNew) {
  const st = document.getElementById('search-status');
  const res = document.getElementById('search-results');
  const oldBtn = document.getElementById('more-btn');
  if(oldBtn) oldBtn.remove();

  st.style.display='block';
  st.textContent = isNew ? '검색 중…' : '불러오는 중…';

  try {
    let items = [], total = 0;

    if(useNaver) {
      // 네이버 책 API
      const r = await fetch(`${NAVER_PROXY}?q=${encodeURIComponent(searchQuery)}&start=${naverStart}&display=${PAGE_SIZE}`);
      if(!r.ok){ st.textContent=`오류: ${r.status}`; return; }
      const d = await r.json();
      if(!d.items||!d.items.length){
        st.textContent = isNew ? '검색 결과가 없어요.' : '더 이상 결과가 없어요.';
        return;
      }
      total = d.total || 0;
      naverStart += d.items.length;
      const shown = Math.min(naverStart-1, total);
      st.textContent = `총 ${total.toLocaleString()}권 중 ${shown}권 표시됨`;

      items = d.items.map(item => {
        const thumb = (item.image||'').replace('http:','https:');
        const title = item.title?.replace(/<[^>]+>/g,'') || '제목 없음';
        const author = item.author?.replace(/<[^>]+>/g,'') || '저자 미상';
        const year = (item.pubdate||'').slice(0,4);
        const id = 'naver_' + encodeURIComponent(item.isbn||title);
        const inShelf = shelf.some(b=>b.gid===id);
        const inWish = wishlist.some(b=>b.gid===id);
        const link = item.link||'';
        const te=encodeURIComponent(title),ae=encodeURIComponent(author),the=encodeURIComponent(thumb),le=encodeURIComponent(link);
        return `<div class="result-card">
          <div class="result-thumb">${thumb?`<img src="${thumb}" alt="표지" loading="lazy">`:'<div class="no-img">📖</div>'}</div>
          <div class="result-meta">
            <div class="result-title">${esc(title)}</div>
            <div class="result-author">${esc(author)}</div>
            <div class="result-year">${year}</div>
          </div>
          <div class="result-btns">
            <button class="add-btn" ${inShelf?'disabled':''} onclick="addBook(this,'${id}','${te}','${ae}','${year}','${the}')">${inShelf?'읽음':'+ 읽었어요'}</button>
            <button class="wish-add-btn" ${inWish||inShelf?'disabled':''} onclick="addWish(this,'${id}','${te}','${ae}','${year}','${the}','${le}')">${inWish?'찜됨':inShelf?'찜됨':'🔖 찜'}</button>
          </div>
        </div>`;
      });

      res.insertAdjacentHTML('beforeend', items.join(''));
      if(naverStart-1 < total) {
        const btn = document.createElement('button');
        btn.id = 'more-btn';
        btn.textContent = `더 보기 (${(total-(naverStart-1)).toLocaleString()}권 남음)`;
        btn.style.cssText = 'width:100%;padding:13px;margin-top:10px;background:none;border:1px solid var(--border2);color:var(--cream2);border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:16px';
        btn.onclick = () => fetchResults(false);
        res.after(btn);
      }
      return;

    } else {
      // Google Books API
      const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(searchQuery)}&maxResults=${PAGE_SIZE}&startIndex=${searchStartIndex}&key=${GOOGLE_KEY}`);
      if(!r.ok){ st.textContent=`오류: ${r.status}`; return; }
      const d = await r.json();
      if(!d.items||!d.items.length){
        st.textContent = isNew ? '검색 결과가 없어요.' : '더 이상 결과가 없어요.';
        return;
      }
      total = d.totalItems || 0;
      searchStartIndex += d.items.length;
      st.textContent = `총 약 ${total.toLocaleString()}권 중 ${searchStartIndex}권 표시됨`;

      items = d.items.map(item=>{
        const info = item.volumeInfo||{};
        const thumb = (info.imageLinks?.thumbnail||'').replace('http:','https:');
        const title = info.title||'제목 없음';
        const author = (info.authors||[]).join(', ')||'저자 미상';
        const year = (info.publishedDate||'').slice(0,4);
        const inShelf = shelf.some(b=>b.gid===item.id);
        const inWish = wishlist.some(b=>b.gid===item.id);
        const te=encodeURIComponent(title),ae=encodeURIComponent(author),the=encodeURIComponent(thumb);
        return `<div class="result-card">
          <div class="result-thumb">${thumb?`<img src="${thumb}" alt="표지" loading="lazy">`:'<div class="no-img">📖</div>'}</div>
          <div class="result-meta">
            <div class="result-title">${esc(title)}</div>
            <div class="result-author">${esc(author)}</div>
            <div class="result-year">${year}</div>
          </div>
          <div class="result-btns">
            <button class="add-btn" ${inShelf?'disabled':''} onclick="addBook(this,'${item.id}','${te}','${ae}','${year}','${the}')">${inShelf?'읽음':'+ 읽었어요'}</button>
            <button class="wish-add-btn" ${inWish||inShelf?'disabled':''} onclick="addWish(this,'${item.id}','${te}','${ae}','${year}','${the}')">${inWish?'찜됨':inShelf?'찜됨':'🔖 찜'}</button>
          </div>
        </div>`;
      });

      res.insertAdjacentHTML('beforeend', items.join(''));
      if(searchStartIndex < total) {
        const btn = document.createElement('button');
        btn.id = 'more-btn';
        btn.textContent = `더 보기 (${(total-searchStartIndex).toLocaleString()}권 남음)`;
        btn.style.cssText = 'width:100%;padding:13px;margin-top:10px;background:none;border:1px solid var(--border2);color:var(--cream2);border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:16px';
        btn.onclick = () => fetchResults(false);
        res.after(btn);
      }
    }

  } catch(e) { st.textContent=`오류: ${e.message}`; }
}
window.doSearch = doSearch;

window.addBook = async (btn,id,title,author,year,thumb) => {
  btn.disabled=true; btn.textContent='읽음';
  const book = {gid:id,title:decodeURIComponent(title),author:decodeURIComponent(author),year,thumb:decodeURIComponent(thumb),r:0,note:'',readDate:'',addedAt:Date.now()};
  await persistBook(book);
  await removeWish(id).catch(()=>{});
  toast('책장에 추가됐어요 📚');
};

window.addWish = async (btn,id,title,author,year,thumb,link='') => {
  btn.disabled=true; btn.textContent='찜됨';
  const book = {gid:id,title:decodeURIComponent(title),author:decodeURIComponent(author),year,thumb:decodeURIComponent(thumb),link:decodeURIComponent(link||''),addedAt:Date.now()};
  await persistWish(book);
  toast('읽을 책에 추가됐어요 🔖');
};

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
