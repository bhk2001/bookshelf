<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1C1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="책장">
<title>책장</title>
<style>
:root {
  --bg:        #1C1410;
  --bg2:       #261C14;
  --bg3:       #2E2018;
  --card:      #2A1E14;
  --border:    rgba(255,220,140,0.10);
  --border2:   rgba(255,220,140,0.20);
  --gold:      #D4943A;
  --gold-lt:   #E8B568;
  --cream:     #F0E6D0;
  --cream2:    #C8B898;
  --muted:     #8A7A64;
  --star-on:   #E8B568;
  --star-off:  #3A2E22;
  --red:       #C0503A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overscroll-behavior:none}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:50;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:16px 20px 14px;
  display:flex;align-items:flex-end;justify-content:space-between;
}
.logo{font-size:22px;font-weight:700;letter-spacing:-0.5px;color:var(--cream)}
.logo em{color:var(--gold);font-style:normal}
.book-count{font-size:13px;color:var(--muted)}

/* ── NAV ── */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:var(--bg2);
  border-top:1px solid var(--border);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;padding:12px 8px 10px;
  background:none;border:none;
  font-size:10px;letter-spacing:0.04em;color:var(--muted);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;
  font-family:inherit;text-transform:uppercase;
  transition:color 0.15s;
}
nav button.active{color:var(--gold)}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ── VIEWS ── */
.view{display:none;padding:20px 16px}
.view.active{display:block}

/* ── SHELF ── */
.stats{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.stat{
  font-size:12px;color:var(--cream2);
  background:var(--bg3);
  border:1px solid var(--border);
  padding:5px 14px;border-radius:20px;
}
.stat b{color:var(--gold-lt);font-weight:600}

/* grid: 2 columns like watcha */
.shelf-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}
.shelf-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:border-color 0.15s, transform 0.1s;
  active:scale(0.97)
}
.shelf-card:active{transform:scale(0.96)}
.shelf-card-img{
  width:100%;aspect-ratio:2/3;
  background:var(--bg3);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.shelf-card-img img{width:100%;height:100%;object-fit:cover}
.shelf-card-img .no-cover{font-size:42px;opacity:0.35}
.shelf-card-img .rating-badge{
  position:absolute;bottom:8px;right:8px;
  background:rgba(20,14,8,0.85);
  border:1px solid var(--border2);
  border-radius:8px;
  padding:4px 8px;
  font-size:12px;font-weight:600;color:var(--gold-lt);
  display:flex;align-items:center;gap:3px;
}
.shelf-card-body{padding:10px 10px 12px}
.shelf-card-title{font-size:13px;font-weight:600;color:var(--cream);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.shelf-card-author{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── SEARCH ── */
.search-wrap{display:flex;gap:8px;margin-bottom:16px}
.search-wrap input{
  flex:1;height:46px;padding:0 16px;
  background:var(--bg3);
  border:1px solid var(--border2);
  border-radius:12px;
  font-size:15px;color:var(--cream);
  font-family:inherit;outline:none;
  transition:border-color 0.15s;
}
.search-wrap input::placeholder{color:var(--muted)}
.search-wrap input:focus{border-color:var(--gold)}
.search-wrap button{
  height:46px;padding:0 18px;
  background:var(--gold);color:#1C1410;
  border:none;border-radius:12px;
  font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;
  white-space:nowrap;
}
.search-wrap button:active{background:var(--gold-lt)}
.search-status{font-size:13px;color:var(--muted);margin-bottom:12px}

/* search results: list style like watcha */
.result-card{
  display:flex;gap:14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:10px;
  padding:12px;
  cursor:default;
}
.result-thumb{
  width:56px;height:80px;
  background:var(--bg3);
  border-radius:8px;
  flex-shrink:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.result-thumb img{width:100%;height:100%;object-fit:cover}
.result-thumb .no-img{font-size:24px;opacity:0.35}
.result-meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.result-title{font-size:14px;font-weight:600;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result-author{font-size:12px;color:var(--cream2)}
.result-year{font-size:11px;color:var(--muted)}
.add-btn{
  align-self:center;
  padding:8px 14px;
  background:none;
  border:1px solid var(--gold);
  color:var(--gold);
  border-radius:10px;font-size:13px;font-weight:600;
  cursor:pointer;white-space:nowrap;font-family:inherit;
  flex-shrink:0;
  transition:background 0.15s;
}
.add-btn:hover{background:rgba(212,148,58,0.12)}
.add-btn:disabled{opacity:0.35;cursor:default;border-color:var(--muted);color:var(--muted)}

/* ── DETAIL ── */
.back-btn{
  display:flex;align-items:center;gap:6px;
  background:none;border:none;
  color:var(--gold);font-size:15px;
  cursor:pointer;font-family:inherit;
  margin-bottom:20px;padding:0;
}
.back-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.detail-hero{
  display:flex;gap:16px;margin-bottom:24px;
}
.detail-cover{
  width:100px;height:150px;
  background:var(--bg3);
  border-radius:10px;flex-shrink:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);
}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail-cover .no-img{font-size:40px;opacity:0.35}
.detail-info{display:flex;flex-direction:column;justify-content:center;gap:5px}
.detail-title{font-size:18px;font-weight:700;color:var(--cream);line-height:1.3}
.detail-author{font-size:13px;color:var(--cream2)}
.detail-year{font-size:12px;color:var(--muted)}

.section-label{
  font-size:11px;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px;
}
.divider{height:1px;background:var(--border);margin:20px 0}

/* big star rating like watcha */
.star-row{display:flex;gap:4px;margin-bottom:4px}
.star-btn{
  font-size:38px;background:none;border:none;cursor:pointer;
  padding:2px;line-height:1;color:var(--star-off);
  transition:color 0.1s, transform 0.1s;
}
.star-btn.on{color:var(--star-on)}
.star-btn:active{transform:scale(0.88)}
.star-hint{font-size:13px;color:var(--muted);margin-bottom:20px;min-height:18px}

.review-box{
  width:100%;min-height:110px;padding:14px;
  background:var(--bg3);
  border:1px solid var(--border2);
  border-radius:12px;
  font-size:15px;color:var(--cream);
  font-family:inherit;resize:vertical;
  outline:none;
  transition:border-color 0.15s;
  margin-bottom:16px;
}
.review-box::placeholder{color:var(--muted)}
.review-box:focus{border-color:var(--gold)}

.btn-row{display:flex;gap:10px;justify-content:flex-end}
.btn-save{
  padding:12px 26px;
  background:var(--gold);color:#1C1410;
  border:none;border-radius:12px;
  font-size:15px;font-weight:700;
  cursor:pointer;font-family:inherit;
}
.btn-save:active{background:var(--gold-lt)}
.btn-delete{
  padding:12px 16px;
  background:none;
  border:1px solid var(--border2);
  color:var(--muted);
  border-radius:12px;font-size:15px;
  cursor:pointer;font-family:inherit;
  transition:border-color 0.15s,color 0.15s;
}
.btn-delete:active{border-color:var(--red);color:var(--red)}

/* ── EMPTY ── */
.empty{text-align:center;padding:64px 20px;color:var(--muted)}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:0.5}
.empty p{font-size:15px;line-height:1.7}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--cream);color:#1C1410;
  padding:10px 22px;border-radius:20px;
  font-size:14px;font-weight:600;
  z-index:200;opacity:0;
  transition:opacity 0.2s;pointer-events:none;
  white-space:nowrap;
}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="logo">책<em>장</em></div>
  <div class="book-count" id="hdr-count"></div>
</header>

<!-- SHELF -->
<div id="shelf-view" class="view active">
  <div class="stats" id="stats-bar" style="display:none"></div>
  <div class="shelf-grid" id="shelf-grid"></div>
</div>

<!-- SEARCH -->
<div id="search-view" class="view">
  <div class="search-wrap">
    <input id="search-input" type="search" placeholder="책 제목, 저자로 검색…">
    <button onclick="doSearch()">검색</button>
  </div>
  <div class="search-status" id="search-status" style="display:none"></div>
  <div id="search-results"></div>
</div>

<!-- DETAIL -->
<div id="detail-view" class="view">
  <button class="back-btn" onclick="closeDetail()">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    책장으로
  </button>
  <div class="detail-hero">
    <div class="detail-cover" id="det-cover"></div>
    <div class="detail-info">
      <div class="detail-title" id="det-title"></div>
      <div class="detail-author" id="det-author"></div>
      <div class="detail-year" id="det-year"></div>
    </div>
  </div>

  <div class="section-label">내 평점</div>
  <div class="star-row" id="star-row"></div>
  <div class="star-hint" id="star-hint"></div>

  <div class="divider"></div>
  <div class="section-label">감상 메모</div>
  <textarea class="review-box" id="review-box" placeholder="읽은 후 남기고 싶은 말…"></textarea>
  <div class="btn-row">
    <button class="btn-delete" onclick="deleteBook()">삭제</button>
    <button class="btn-save" onclick="saveBook()">저장</button>
  </div>
</div>

<!-- NAV -->
<nav>
  <button class="active" id="nav-shelf" onclick="switchView('shelf')">
    <svg viewBox="0 0 24 24"><rect x="2" y="4" width="6" height="16" rx="1"/><rect x="9" y="4" width="6" height="16" rx="1"/><rect x="16" y="4" width="6" height="16" rx="1" opacity=".45"/></svg>
    책장
  </button>
  <button id="nav-search" onclick="switchView('search')">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    책 추가
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const STAR_LABELS = ['','별로예요','그저 그래요','괜찮아요','좋았어요','최고예요'];
let shelf = [];
let curIdx = null;
let curRating = 0;
let prevView = 'shelf';

function load(){
  try{ shelf = JSON.parse(localStorage.getItem('czBookshelf')||'[]'); }catch(e){ shelf=[]; }
  renderShelf();
}
function persist(){ localStorage.setItem('czBookshelf', JSON.stringify(shelf)); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

function switchView(v){
  ['shelf','search','detail'].forEach(x=>{
    document.getElementById(x+'-view').classList.toggle('active', x===v);
    const b = document.getElementById('nav-'+x);
    if(b) b.classList.toggle('active', x===v);
  });
  if(v!=='detail') prevView=v;
  if(v==='shelf') renderShelf();
}

/* ── SHELF ── */
function renderShelf(){
  const grid = document.getElementById('shelf-grid');
  const statsBar = document.getElementById('stats-bar');
  const hdr = document.getElementById('hdr-count');
  if(!shelf.length){
    hdr.textContent='';
    statsBar.style.display='none';
    grid.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📚</div><p>아직 읽은 책이 없어요.<br>아래에서 책을 검색해 추가해보세요.</p></div>';
    return;
  }
  hdr.textContent=`${shelf.length}권`;
  const rated=shelf.filter(b=>b.r>0);
  const avg=rated.length?(rated.reduce((a,b)=>a+b.r,0)/rated.length).toFixed(1):'-';
  statsBar.style.display='flex';
  statsBar.innerHTML=`<div class="stat">총 <b>${shelf.length}권</b></div><div class="stat">평균 <b>★ ${avg}</b></div>`;
  grid.innerHTML=shelf.map((b,i)=>`
    <div class="shelf-card" onclick="openDetail(${i})">
      <div class="shelf-card-img">
        ${b.thumb?`<img src="${b.thumb}" alt="표지" loading="lazy">`:'<div class="no-cover">📖</div>'}
        ${b.r?`<div class="rating-badge">★ ${b.r}</div>`:''}
      </div>
      <div class="shelf-card-body">
        <div class="shelf-card-title">${esc(b.title)}</div>
        <div class="shelf-card-author">${esc(b.author)}</div>
      </div>
    </div>`).join('');
}

/* ── DETAIL ── */
function openDetail(idx){
  curIdx=idx; const b=shelf[idx]; curRating=b.r||0;
  const dc=document.getElementById('det-cover');
  dc.innerHTML=b.thumb?`<img src="${b.thumb}" alt="표지">`:'<div class="no-img">📖</div>';
  document.getElementById('det-title').textContent=b.title;
  document.getElementById('det-author').textContent=b.author;
  document.getElementById('det-year').textContent=b.year||'';
  document.getElementById('review-box').value=b.note||'';
  renderStars();
  switchView('detail');
}

function renderStars(){
  const row=document.getElementById('star-row');
  const hint=document.getElementById('star-hint');
  row.innerHTML=[1,2,3,4,5].map(s=>`
    <button class="star-btn${curRating>=s?' on':''}"
      onclick="setRating(${s})"
      onmouseover="previewHint(${s})"
      onmouseout="resetHint()"
      aria-label="${s}점">★</button>`).join('');
  hint.textContent=curRating?STAR_LABELS[curRating]:'';
}

function previewHint(n){ document.getElementById('star-hint').textContent=STAR_LABELS[n]; }
function resetHint(){ document.getElementById('star-hint').textContent=STAR_LABELS[curRating]||''; }
function setRating(n){ curRating=n; renderStars(); }

function saveBook(){
  shelf[curIdx].r=curRating;
  shelf[curIdx].note=document.getElementById('review-box').value.trim();
  persist();
  toast('저장했어요 ✓');
  setTimeout(()=>switchView('shelf'),1200);
}

function deleteBook(){
  if(!confirm('이 책을 삭제할까요?')) return;
  shelf.splice(curIdx,1);
  persist();
  switchView('shelf');
}

function closeDetail(){ switchView(prevView); }

/* ── SEARCH ── */
document.getElementById('search-input').addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(); });

async function doSearch(){
  const q=document.getElementById('search-input').value.trim();
  if(!q) return;
  const st=document.getElementById('search-status');
  const res=document.getElementById('search-results');
  st.style.display='block'; st.textContent='검색 중…'; res.innerHTML='';
  try{
    const url=`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=12&key=AIzaSyDsDRQ7zRtUT65sRgwOluJx_e0r4hfMdG4`;
    const r=await fetch(url, {method:'GET', headers:{'Accept':'application/json'}});
    if(!r.ok){ st.textContent=`API 오류: ${r.status} ${r.statusText}`; return; }
    const d=await r.json();
    if(d.error){ st.textContent=`오류: ${d.error.message}`; return; }
    if(!d.items||!d.items.length){ st.textContent='검색 결과가 없어요. 다른 키워드로 시도해보세요.'; return; }
    st.textContent=`${d.totalItems.toLocaleString()}권 중 ${d.items.length}권 표시`;
    res.innerHTML=d.items.map(item=>{
      const info=item.volumeInfo||{};
      const thumb=(info.imageLinks?.thumbnail||'').replace('http:','https:');
      const title=info.title||'제목 없음';
      const author=(info.authors||[]).join(', ')||'저자 미상';
      const year=(info.publishedDate||'').slice(0,4);
      const inShelf=shelf.some(b=>b.gid===item.id);
      const te=encodeURIComponent(title),ae=encodeURIComponent(author),the=encodeURIComponent(thumb);
      return `<div class="result-card">
        <div class="result-thumb">${thumb?`<img src="${thumb}" alt="표지" loading="lazy">`:'<div class="no-img">📖</div>'}</div>
        <div class="result-meta">
          <div class="result-title">${esc(title)}</div>
          <div class="result-author">${esc(author)}</div>
          <div class="result-year">${year}</div>
        </div>
        <button class="add-btn" ${inShelf?'disabled':''} onclick="addBook(this,'${item.id}','${te}','${ae}','${year}','${the}')">${inShelf?'추가됨':'+ 추가'}</button>
      </div>`;
    }).join('');
  }catch(e){
    st.textContent=`오류: ${e.message}`;
    console.error('Search error:', e);
  }
}

function addBook(btn,id,title,author,year,thumb){
  btn.disabled=true; btn.textContent='추가됨';
  shelf.push({ gid:id, title:decodeURIComponent(title), author:decodeURIComponent(author), year, thumb:decodeURIComponent(thumb), r:0, note:'' });
  persist();
  toast('책장에 추가됐어요 📚');
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

load();
</script>
</body>
</html>
